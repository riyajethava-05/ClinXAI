services:
  - type: web
    name: clinxai-clinical-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m src.train_model
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
